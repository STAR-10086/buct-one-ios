name: build-ipa

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后发布 GitHub Release 与 R2 源'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release 标签名（如 v0.1.0）'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      publish_release:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ (inputs.publish_release && '0') || '1' }}

      - name: Resolve version & validate release tag
        id: ver
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VER_NAME=$(grep -E '^MARKETING_VERSION\s*=' Config/Version.xcconfig | sed 's/.*=\s*//' | tr -d '[:space:]')
          VER_CODE=$(grep -E '^CURRENT_PROJECT_VERSION\s*=' Config/Version.xcconfig | sed 's/.*=\s*//' | tr -d '[:space:]')
          if [ -z "$VER_NAME" ] || [ -z "$VER_CODE" ]; then
            echo "::error::Config/Version.xcconfig 缺少版本号"
            exit 1
          fi
          if [ "${PUBLISH_RELEASE:-false}" = "true" ] && [ -n "${RELEASE_TAG:-}" ]; then
            BASE_TAG="${RELEASE_TAG%%-*}"
            if [ "v${VER_NAME}" != "${BASE_TAG}" ]; then
              echo "::error::版本不一致: v${VER_NAME} != ${BASE_TAG} (from ${RELEASE_TAG})"
              exit 1
            fi
          fi
          IS_DEV_PRERELEASE="false"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${PUBLISH_RELEASE:-false}" != "true" ]; then
            IS_DEV_PRERELEASE="true"
          fi
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_dev_prerelease=${IS_DEV_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Prepare optional secrets xcconfig
        env:
          ELECTRICITY_SIGN_SECRET: ${{ secrets.ELECTRICITY_SIGN_SECRET }}
        run: |
          if [ -n "${ELECTRICITY_SIGN_SECRET:-}" ]; then
            printf 'ELECTRICITY_SIGN_SECRET = %s\n' "$ELECTRICITY_SIGN_SECRET" > Config/Secrets.xcconfig
          fi

      - name: Install XcodeGen & generate project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate --spec project.yml

      - name: Archive & package unsigned IPA
        env:
          VER_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build/standard dist

          xcodebuild archive \
            -project BuctOne.xcodeproj \
            -scheme BuctOne \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/standard/BuctOne.xcarchive \
            -derivedDataPath build/dd-standard \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

          STD_APP="build/standard/BuctOne.xcarchive/Products/Applications/BuctOne.app"
          if [ -d "${STD_APP}/PlugIns" ]; then
            echo "::error::IPA 不得包含 PlugIns 扩展"
            exit 1
          fi
          mkdir -p build/payload-std/Payload
          cp -R "$STD_APP" build/payload-std/Payload/
          find build/payload-std \( -name '.DS_Store' -o -name '._*' \) -delete
          plutil -convert xml1 build/payload-std/Payload/BuctOne.app/Info.plist
          codesign --force --sign - --entitlements App/Entitlements/BuctOneStandard.entitlements build/payload-std/Payload/BuctOne.app
          codesign --verify --strict build/payload-std/Payload/BuctOne.app
          STD_IPA="buct-one-ios-v${VER_NAME}-unsigned.ipa"

          # 使用纯 ZIP32 STORE + 零 extra field 打包，并按 SideStore SideSign 逻辑校验
          python3 - "build/payload-std" "dist/${STD_IPA}" "com.buct.one" <<'PY'
          import os, plistlib, stat, struct, sys, time, zipfile, zlib

          def zip_payload(payload_root, out_ipa):
              with zipfile.ZipFile(out_ipa, "w", compression=zipfile.ZIP_STORED, allowZip64=False) as zf:
                  for root, dirs, files in os.walk(payload_root):
                      dirs[:] = sorted(d for d in dirs if d not in ("__MACOSX",) and not d.startswith("._") and d != ".DS_Store")
                      files = sorted(f for f in files if not f.startswith("._") and f != ".DS_Store")
                      rel_root = os.path.relpath(root, payload_root)
                      if rel_root != ".":
                          rel_dir = rel_root.replace(os.sep, "/") + "/"
                          st = os.lstat(root)
                          zi = zipfile.ZipInfo(rel_dir, date_time=time.localtime(st.st_mtime)[:6])
                          zi.create_system = 3
                          zi.compress_type = zipfile.ZIP_STORED
                          zi.flag_bits = 0x0800
                          zi.external_attr = (stat.S_IFDIR | (st.st_mode & 0o777) or 0o755) << 16
                          zi.extra = b""
                          zf.writestr(zi, b"")
                      for fn in files:
                          full_path = os.path.join(root, fn)
                          rel_file = os.path.relpath(full_path, payload_root).replace(os.sep, "/")
                          st = os.lstat(full_path)
                          zi = zipfile.ZipInfo(rel_file, date_time=time.localtime(st.st_mtime)[:6])
                          zi.create_system = 3
                          zi.compress_type = zipfile.ZIP_STORED
                          zi.flag_bits = 0x0800
                          zi.external_attr = (stat.S_IFREG | (st.st_mode & 0o777)) << 16
                          zi.extra = b""
                          with open(full_path, "rb") as f:
                              zf.writestr(zi, f.read())

          def has_lc_code_signature(macho_bytes):
              magic, _, _, _, ncmds, _, _, _ = struct.unpack_from("<IIIIIIII", macho_bytes, 0)
              assert magic == 0xfeedfacf, f"unexpected Mach-O magic: {hex(magic)}"
              off = 32
              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from("<II", macho_bytes, off)
                  if cmd == 0x1d:
                      return True
                  off += cmdsize
              return False

          def verify_sidesign_ipa(ipa_path, expected_bundle_id):
              data = open(ipa_path, "rb").read()
              assert len(data) >= 22, f"{ipa_path}: file too small"
              search_len = min(len(data), 65536 + 22)
              search_off = len(data) - search_len
              search = data[search_off:]
              eocd = None
              for i in range(len(search) - 22, -1, -1):
                  if struct.unpack_from("<I", search, i)[0] == 0x06054b50:
                      eocd = i
                      break
              assert eocd is not None, f"{ipa_path}: EOCD not found"
              total_entries = struct.unpack_from("<H", search, eocd + 10)[0]
              cd_size = struct.unpack_from("<I", search, eocd + 12)[0]
              cd_offset = struct.unpack_from("<I", search, eocd + 16)[0]
              assert cd_offset + cd_size <= len(data), f"{ipa_path}: CD out of bounds"
              cd = data[cd_offset:cd_offset + cd_size]
              off = 0
              for _ in range(total_entries):
                  magic = struct.unpack_from("<I", cd, off)[0]
                  assert magic == 0x02014b50
                  method = struct.unpack_from("<H", cd, off + 10)[0]
                  crc = struct.unpack_from("<I", cd, off + 16)[0]
                  comp = struct.unpack_from("<I", cd, off + 20)[0]
                  uncomp = struct.unpack_from("<I", cd, off + 24)[0]
                  nlen = struct.unpack_from("<H", cd, off + 28)[0]
                  elen = struct.unpack_from("<H", cd, off + 30)[0]
                  clen = struct.unpack_from("<H", cd, off + 32)[0]
                  loff = struct.unpack_from("<I", cd, off + 42)[0]
                  name = cd[off + 46:off + 46 + nlen].decode("utf-8")
                  off += 46 + nlen + elen + clen
                  assert method == 0, f"{ipa_path}: {name} expected STORE (0), got {method}"
                  assert elen == 0, f"{ipa_path}: {name} CD extra len {elen} != 0"
                  lmagic = struct.unpack_from("<I", data, loff)[0]
                  lnlen = struct.unpack_from("<H", data, loff + 26)[0]
                  lelen = struct.unpack_from("<H", data, loff + 28)[0]
                  assert lmagic == 0x04034b50, f"{ipa_path}: {name} bad local header magic"
                  assert lelen == 0, f"{ipa_path}: {name} local extra len {lelen} != 0"
                  raw = data[loff + 30 + lnlen + lelen:loff + 30 + lnlen + lelen + comp]
                  assert len(raw) == uncomp
                  if uncomp > 0 and crc != 0:
                      assert (zlib.crc32(raw) & 0xffffffff) == crc, f"{ipa_path}: {name} CRC mismatch"
              with zipfile.ZipFile(ipa_path, "r") as zf:
                  assert zf.testzip() is None
                  plist = plistlib.loads(zf.read("Payload/BuctOne.app/Info.plist"))
                  assert plist["CFBundleIdentifier"] == expected_bundle_id
                  assert has_lc_code_signature(zf.read("Payload/BuctOne.app/BuctOne")), "Main Mach-O missing LC_CODE_SIGNATURE"
              print(f"Verified SideSign-compatible IPA: {ipa_path} ({len(data)} bytes, {total_entries} entries)")

          src_dir, out_ipa, bid = sys.argv[1], sys.argv[2], sys.argv[3]
          zip_payload(src_dir, out_ipa)
          verify_sidesign_ipa(out_ipa, bid)
          PY

          unzip -t "dist/${STD_IPA}" >/dev/null

          # 3. SHA-256 与体积门禁
          cd dist
          for f in *.ipa; do
            shasum -a 256 "$f" > "${f}.sha256"
            size_bytes=$(stat -f%z "$f")
            size_mb=$((size_bytes / 1024 / 1024))
            echo "${f}: ${size_bytes} bytes (~${size_mb} MB)"
            if [ "$size_bytes" -gt 52428800 ]; then
              echo "::error::${f} 超过 50MB 体积硬门禁"
              exit 1
            elif [ "$size_bytes" -gt 31457280 ]; then
              echo "::warning::${f} 超过 30MB 体积预警"
            fi
          done

      - name: Generate SideStore / AltStore source manifest (apps.json)
        env:
          VER_NAME: ${{ steps.ver.outputs.version_name }}
          VER_CODE: ${{ steps.ver.outputs.version_code }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          IS_DEV_PRERELEASE: ${{ steps.ver.outputs.is_dev_prerelease }}
          REPO_FULL_NAME: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, re

          ver = os.environ["VER_NAME"]
          build_ver = os.environ["VER_CODE"]
          publish_release = os.environ.get("PUBLISH_RELEASE", "false").lower() == "true"
          is_dev = os.environ.get("IS_DEV_PRERELEASE", "false").lower() == "true"
          release_tag = os.environ.get("RELEASE_TAG") or ""
          tag = release_tag if release_tag else ("dev-latest" if is_dev else f"v{ver}")
          repo = os.environ.get("REPO_FULL_NAME", "STAR-10086/buct-one-ios")
          short_sha = os.environ.get("GITHUB_SHA", "")[:7]

          std_name = f"buct-one-ios-v{ver}-unsigned.ipa"
          std_size = os.path.getsize(f"dist/{std_name}")

          notes = f"BUCT One iOS {tag}"
          if os.path.exists("CHANGELOG.md"):
              ch = open("CHANGELOG.md", encoding="utf-8").read()
              m = re.search(rf"##\s+v{re.escape(ver)}\b[^\n]*\n(.*?)(?=\n##\s+v|\Z)", ch, re.S)
              if m and m.group(1).strip():
                  notes = m.group(1).strip()

          release_md = notes
          if is_dev:
              release_md += (
                  f"\n\n---\n"
                  f"- **滚动预发布构建**：`{short_sha}`（`v{ver}` build `{build_ver}`）\n"
                  f"- **安装包**（`{std_name}`）：不含小组件扩展，仅占 1 个 App ID，兼容 SideStore / AltStore / LiveContainer 与免费 Apple ID 自签\n"
              )

          with open("dist/release-notes.md", "w", encoding="utf-8") as f:
              f.write(release_md + "\n")

          today_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          dl_tag = "dev-latest" if is_dev else tag
          std_url = f"https://github.com/{repo}/releases/download/{dl_tag}/{std_name}"
          if publish_release and "-" not in tag:
              icon_url = "https://update.buct.one/ios/icon.png"
          else:
              icon_url = f"https://raw.githubusercontent.com/{repo}/main/App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          source = {
              "name": "BUCT One · 北化一站",
              "identifier": "one.buct.ios.source",
              "sourceURL": "https://update.buct.one/ios/apps.json",
              "apps": [
                  {
                      "name": "北化一站",
                      "bundleIdentifier": "com.buct.one",
                      "developerName": "STAR-10086",
                      "subtitle": "北京化工大学校园工作台 · iOS 26 原生液态玻璃",
                      "localizedDescription": "面向北京化工大学师生的 iOS 26 原生液态玻璃校园工作台。无小组件扩展，仅占 1 个 App ID，兼容 SideStore / AltStore / LiveContainer 与免费 Apple ID 自签。",
                      "iconURL": icon_url,
                      "tintColor": "0A84FF",
                      "downloadURL": std_url,
                      "size": std_size,
                      "version": ver,
                      "versionDate": today_iso,
                      "versionDescription": notes,
                      "versions": [
                          {
                              "version": ver,
                              "buildVersion": build_ver,
                              "date": today_iso,
                              "localizedDescription": notes,
                              "downloadURL": std_url,
                              "size": std_size,
                              "minOSVersion": "26.0"
                          }
                      ]
                  }
              ],
              "news": []
          }

          with open("dist/apps.json", "w", encoding="utf-8") as f:
              json.dump(source, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buct-one-ios-unsigned-ipas
          path: |
            dist/*.ipa
            dist/*.sha256
            dist/apps.json

      - name: Clean & update dev-latest tag for rolling Pre-release
        if: steps.ver.outputs.is_dev_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-latest "${GITHUB_SHA}"
          git push -f origin dev-latest

          if gh release view dev-latest >/dev/null 2>&1; then
            for asset in $(gh release view dev-latest --json assets --jq '.assets[].name'); do
              gh release delete-asset dev-latest "$asset" --yes || true
            done
          fi

      - name: Publish dev-latest Pre-release
        if: steps.ver.outputs.is_dev_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "BUCT One iOS Dev Latest (v${{ steps.ver.outputs.version_name }})"
          prerelease: true
          make_latest: false
          body_path: dist/release-notes.md
          files: |
            dist/*.ipa
            dist/*.sha256
            dist/apps.json
          fail_on_unmatched_files: true

      - name: Publish GitHub Release
        if: inputs.publish_release == true && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "BUCT One iOS ${{ inputs.release_tag }}"
          prerelease: ${{ contains(inputs.release_tag, '-') }}
          body_path: dist/release-notes.md
          files: |
            dist/*.ipa
            dist/*.sha256
            dist/apps.json
          fail_on_unmatched_files: true

      - name: Upload SideStore source manifest to Cloudflare R2
        if: inputs.publish_release == true && inputs.release_tag != '' && !contains(inputs.release_tag, '-')
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ENDPOINT:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::缺少 Cloudflare R2 secrets"
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION="auto"
          export AWS_EC2_METADATA_DISABLED="true"

          BUCKET="buct-one"
          CLEAN_ENDPOINT="${R2_ENDPOINT%/}"
          CLEAN_ENDPOINT="${CLEAN_ENDPOINT%/${BUCKET}}"
          CACHE="public, max-age=60, stale-while-revalidate=300"

          aws s3 cp "dist/apps.json" "s3://${BUCKET}/ios/apps.json" \
            --endpoint-url "${CLEAN_ENDPOINT}" --no-progress --content-type "application/json; charset=utf-8" --cache-control "${CACHE}"
          aws s3 cp "App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" "s3://${BUCKET}/ios/icon.png" \
            --endpoint-url "${CLEAN_ENDPOINT}" --no-progress --content-type "image/png" --cache-control "${CACHE}"
